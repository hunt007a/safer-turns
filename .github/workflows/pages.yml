# For later, once the code is on GitHub: rebuild the Toronto road file every Monday
# and publish the web/ folder to GitHub Pages. Not used until a repository exists.
name: Build roads and publish
on:
  schedule: [{ cron: "0 9 * * 1" }]
  workflow_dispatch:
# Least privilege: nothing by default; each job asks only for what it needs.
permissions: {}
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests && python build_roads.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
